name: Windows VST3
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64
        run: cmake --preset windows-vs2022
      - name: Build
        run: cmake --build --preset windows-release --parallel 2
      - name: Tests
        run: ctest --preset windows-release
      - uses: actions/upload-artifact@v4
        with:
          name: IRON2500-Windows-x64
          path: |
            Build/windows/IRON2500_artefacts/Release/VST3/*.vst3
            Build/windows/IRON2500_artefacts/Release/Standalone/*.exe
            Documentation/
            LICENSE
